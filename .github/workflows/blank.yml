name: Market‑assistant (manual)

on:
  workflow_dispatch:          # только по кнопке
    inputs:
      tickers_file:           # необязательный параметр
        description: 'YAML со списком тикеров'
        required: false
        default: 'config/tickers_nasdaq_small.yaml'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market assistant
        env:                   # передаём ключи из Secrets
          FMP_KEY: ${{ secrets.FMP_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          python main.py daily --tickers ${{ inputs.tickers_file }}

      - name: Upload signals (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: signals
          path: data/processed/signals.parquet
